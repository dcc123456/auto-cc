# 插件装配清单（spec 1.3-01）
#
# 这里是「装哪些插件、以什么顺序、带什么配置」的唯一入口：注掉一行，重启后界面插件树里
# 就确实没有它。清单只写 id，不写模块路径——主进程是 esbuild 打成单文件的，运行时按路径
# 动态 import 拿不到实现，实现由 `packages/main/src/registry.ts` 的注册表提供。
#
# `dependsOn` 决定挂载顺序；运行期的依赖等待由插件自身的 `inject` 声明负责
# （依赖缺席时 cordis 把插件留在 PENDING，见 spec 1.3-09）。
plugins:
  - id: config
    config:
      appName: auto-cc

  - id: logger
    dependsOn: [config]
    config:
      level: info
      buffer: 500
      file: auto-cc.log

  - id: store
    dependsOn: [config]
    config:
      file: store.db
      journal: wal

  # 模型出口（spec 2.5-12）：全仓**唯一**的 LLM 请求通道，`pnpm lint` 里的 `check-llm-single-entry` 守这条。
  # 默认留空 = 「未配置」：`complete()` 以 `LLM_UNAVAILABLE` 结构化失败，且一次网络都不发，
  # 所以话术生成的模板回落是**可测的**（spec 2.5-01），不是碰运气。
  # 这里不写 key：清单是入库文件，AGENTS.md §8.6 禁止把密钥写进仓库。key 的读取链是「密钥库优先 → 环境变量兜底」
  # （界面里填过一次就归密钥库，见 spec 7.1-07；不装界面时导出环境变量同样算数，脚本化配置路径没有被界面取代）。
  # 要真跑模型就补两行（或直接在「信任」工作台的模型分区里填，那两行会被持久层覆盖）：
  #   baseUrl: https://api.deepseek.com
  #   model: deepseek-chat
  - id: llm

  # 向量出口（spec 4.3-07 / 08）：与上面同包、同一个客户端的**第二个方法**，但配置各自独立——
  # DeepSeek 没有 embeddings 端点而硅基流动有，绑在一起配就会变成「为了要向量而把话术生成改地址」
  # （plan §4.3-d 证据 [4]）。默认留空 = 未配置：`embed()` 以 `LLM_UNAVAILABLE` 结构化失败且一次网络都不发，
  # 于是知识库检索自动退回「词面 + 倒排」而不产生伪向量，4.3-04 的断网/无 key 可用因此是可测的。
  # key 同样不进清单（§8.6），走上面那条「密钥库优先 → `AUTO_CC_SILICONFLOW_API_KEY` 兜底」的读取链。要真跑向量就补两行：
  #   baseUrl: https://api.siliconflow.cn/v1
  #   model: BAAI/bge-m3
  # 维度不写在这里：bge-m3 的 1024 只是文档读数，实际维度以响应为准并落进 `kb_vectors.dim`（4.3-03 无魔法数口径）。
  - id: llm-embed

  # 模型设置模块（spec 7.1-07 ~ 10）：「信任」工作台里那三格（端点 / 模型名 / key）背后的那只手。
  # 必须排在 `llm` 与 `llm-embed` 之后（AGENTS.md §9 实测 5.1-c：清单顺序就是挂载顺序），
  # 因为它读的是那两只的**生效配置**——排在前面只会读到"还没挂上"的空读数。
  # 它自己一个字节都不发：`check()` 经 `llm.chat.complete()` 要结果，所以这不算第三套模型客户端
  # （`scripts/check-llm-single-entry.ts` 为这一条单独开了白名单格，并守住「settings 不许 import http.js」）。
  # 不写任何配置：`providerId` / `embedProviderId` 由界面保存时写进 userData/settings.json 的持久层。
  - id: llm-settings

  # 外发额度骨架（spec 1.9）：账本与闸门各占一条，因为 1.9-05 要能**只摘掉闸门**而账本还活着。
  # `mode: unlimited` 是当前产品阶段的 shipped 默认——不收费、不登录、不联网校验（1.9-02 / 1.9-09）。
  # 上限是**按动作**的三条（spec 2.7-03）：抓取（一轮 run 记一条）、打招呼、投递各自计数、互不占用，
  # 所以 `search: 40` 不会因为抓了 40 轮就把打招呼饿死。想演示超限就在调试面板把该插件配置改成
  # `mode: daily` + 对应动作 `1`（1.9-03，不重启 app）；三个键都写在这里而不是藏进代码默认值，
  # 是为了让「今天还能搜几次」在现场读得到。
  - id: usage
    dependsOn: [store]

  - id: entitlement
    dependsOn: [usage]
    config:
      mode: unlimited
      dailyLimits:
        search: 40
        greet: 20
        deliver: 10

  # 闸门之外的最薄外发消费者：它只把闭包交给 `gate.perform()`，所以清单里注掉 `entitlement`
  # 之后，这条也会跟着进 PENDING —— 界面点「外发样例」得到的是结构化错误，而不是静默成功。
  - id: outbound
    dependsOn: [entitlement]

  # 节奏节流（spec 2.5-04 / 2.5-05 / 2.7-04）：只回答「隔多久」，不持有计时器也不计数——
  # 日上限仍归 `entitlement`，真正 await 由调用方用 core 的 `sleep` 做（plan §12.3 要避免的是第二套配额与第二套调度器）。
  # 两组区间：外发之间（打招呼/投递）与页面动作之间（抓取滚一轮、读一条详情）。
  # 显式写在这里而不是藏在代码默认值里：演示「非固定节奏」要能在装配面板现场改宽改窄，不重启 app。
  - id: outbound-throttle
    config:
      minGapMs: 45000
      maxGapMs: 150000
      scrollMinGapMs: 300
      scrollMaxGapMs: 900

  # IPC 网关（spec 1.4-01）：全应用唯一的跨进程通道，所以排在 shell 之前——
  # 窗口由 shell 创建，界面能发起调用时处理器必须已经在位。
  - id: ipc
    dependsOn: [logger]

  # 插件运行时管理（spec 1.5-01…08）：启停、热重载、错误历史、泄漏巡检。
  # 这里**不写** `dependsOn: [kernel]`——清单拓扑只认清单内的 id，而 `kernel` 是主进程直接
  # 挂的装配器；运行期依赖由插件自身的 `inject = ['kernel']` 负责。也不依赖 `config`：
  # 1.5-04 要演示「停掉 config → log/store 降级」，管理器必须活得比被停的对象久。
  - id: plugins
    dependsOn: [ipc]
    config:
      guarded: [kernel, ipc, plugins]
      history: 20

  # 可视自测通道的主进程侧读数（spec 1.6-01 / 1.6-06）：只读，不导航、不注入，
  # 因此不需要窗口先建好——它读的是 `webContents.getAllWebContents()`，界面首屏调用时已有目标。
  - id: devtools
    dependsOn: [ipc]

  # 工具注册表与对话接线面（spec 1.11 / 2.8-08）：`agent.tools` 是**登记处**，登记由各能力包
  # （`sessions` / `browser` / `platform-boss` / `outbound` / `resume-kb`）在自己的 init 里发起，所以本行必须排在
  # 它们**之前**——清单顺序即挂载顺序，晚挂载的注册表会让每一次登记都打在「注册表未挂载」上，
  # 界面上得到的是空清单，而不是一句 `TOOL_NOT_REGISTERED`（各服务的就绪日志会显式报 0 个）。
  # 5.1-c 现场撞上的正是这条：`outbound-script` 原本排在下面那一行之前（它 2.5 落地时不登记任何东西），
  # 本片给它加了 `outbound.script.generate`，活体日志于是报「agent 工具登记 0 个（注册表未挂载）」，
  # 界面清单少一只工具而全局没有任何报错——单测察觉不到（用例先把注册表替身挂在前面），只有真 app 看得见。
  # 因此这一行下面的 `outbound-script` 整块挪到这里之后，并且这条顺序从此由 `scripts/check-tool-contract.ts` 机检。
  # 为什么用顺序而不是 `dependsOn: [agent]`：那会把浏览器层 / 会话层 / 外发层绑成对话插件的下游，
  # 「在装配面板里单独摘掉 agent」就会连带把 L2 全部降为 PENDING，而插件可单独摘是 1.5-03/04
  # 已经验收过的行为，本片不悄悄改掉它（代价与补偿见 plan §15.7 落点 2）。
  # `chat` 依赖 store：会话与消息必须重启后还在（1.11-08），两张表的迁移号段取 2（plan §8.4 决策 6 更正）。
  - id: agent
    dependsOn: [ipc]

  # 话术生成（spec 2.5-01 / 09 / 10）：外发域的"内容侧"，与上面那条"传输侧"分开，
  # 因为它依赖的是模型出口而不是闸门。摘掉 `llm` 时这条进 PENDING、外发样例照旧能发；
  # 模型未配置时它照样挂载，只是每次生成都以模板回落并在结果里带上回落原因（界面据此播报）。
  # 5.1-c 起它还要在自己的 init 里登记 `outbound.script.generate`，所以整块挪到 `agent` 之后（顺序理由见上一段）。
  - id: outbound-script
    dependsOn: [llm]

  - id: shell
    dependsOn: [plugins]

  # 打印执行器（spec 3.3）：全仓**唯一**调 `webContents.printToPDF` 的地方，落在 L1 shell 包（它是唯一认识 Electron 的层）。
  # 排在 shell 之后：它挂的是 shell 服务的进程，与 Electron app ready 同期就位。摘掉这一行，
  # 下面的 `resume-export` 连同进 PENDING（它的 `inject` 里有 `resume.print`），界面点「导出 PDF」给出结构化错误——
  # 「渲染层无 electron」这条边界因此是可演示的：L2 的 resume-doc 永远拿不到 BrowserWindow，只能通过这个端口要一次渲染。
  - id: resume-print
    dependsOn: [shell]

  # 内置内核会话（spec 1.8）：每个平台一份 `persist:<id>` 分区，登录态落 userData。
  # 排在 shell 之后：它要请 shell 按指定分区重建内嵌视图（视图宿主唯一，见 plan §8.3 决策 1）。
  # `fixture` / `fixture-alt` 两个分区指向同一个本地服务的两条路径，用来证明 cookie 互不共享，
  # 也是自动化验收面（AGENTS.md §7.2：测试一律打本地站点，本条不因下面的改动而松动）。
  # `boss` 自 2026-10-08 起指向**真实站点**（P8）：这就是 145 行原来那句"届时改这一行 startUrl 即可，
  # 代码路径不变"的兑现。导航许可按已登记平台的 startUrl 同源取白名单（`navigate-policy.ts`），
  # 所以这一行同时是"真域名可导航"的开关；而选择器仍来自本地仿站的知识包，
  # 对着真站点动手会以定位失败收场（8.0 在场取证 → 8.1 发布真实包之后才谈得上自动化）。
  - id: sessions
    dependsOn: [shell]
    config:
      platforms:
        - id: fixture
          startUrl: http://127.0.0.1:10233/
          sessionCookieName: autocc_session
        - id: fixture-alt
          startUrl: http://127.0.0.1:10233/alt
          sessionCookieName: autocc_session
        - id: boss
          startUrl: https://www.zhipin.com/
          sessionCookieName: autocc_session

  # 页面操作入口（spec 2.1）：导航与快照，2.2 起在同一条注入通道上加点击/输入/定位。
  # 排在 sessions 之后：它不拥有分区，只在「会话已经打开」的那块视图上做事（未打开时结构化失败）。
  # 服务名是 `browser.page`（`域.能力` 约定），清单 id 用短名 `browser`——与 usage/entitlement 同一种关系。
  - id: browser
    dependsOn: [sessions]
    config:
      navigateTimeoutMs: 10000
      snapshotTextLimit: 4000
      # 批量抽取的两道上限（spec 2.3-01）：一屏回传多少张卡、每个字段带回多少字。
      # 写成配置是为了在装配面板上把 `extractRowLimit` 调到 3，看界面如何如实报告「被截断」。
      extractRowLimit: 12
      extractTextLimit: 4000

  # 定位层（spec 2.2-01…05）：页面只回读候选，打分、去重、判歧义、指纹自愈全在这条服务里。
  # 阈值写成配置而不是常量：2.2-02 要能在装配面板上把 `minScore` 调到 100 看界面如何拒绝猜测。
  # 注掉这一行后，`browser-act` 连同进 PENDING（它的 `inject` 里有 `browser.locate`）。
  - id: browser-locate
    dependsOn: [browser]
    config:
      minScore: 70
      minMargin: 12
      candidateLimit: 5
      textNormalizationLimit: 80

  # 动作层（spec 2.2-03 / 2.2-10 / 2.2-12 / 2.2-13）：等待 → 定位 → 折算坐标 → 下发 → 回读。
  # `cdpInputEnabled: false` 是显式降级开关——界面与日志会一起改口成 dom / trusted:false，
  # 而不是静默地用不受信事件冒充真实点击。
  - id: browser-act
    dependsOn: [browser-locate]
    config:
      waitForTimeoutMs: 5000
      stableCheckSamples: 2
      waitCheckMs: 100
      cdpInputEnabled: true
      # 文件注入后的回读窗口（spec 2.6-04）：这两个数原来是注入脚本的默认实参，2.7-04 把它们搬到配置面。
      uploadReadbackMs: 1500
      uploadReadbackStepMs: 50

  # 平台登记处（spec 2.2-07）：内核唯一认识站点的入口，本身不含任何站点知识。
  # 渲染层只拿得到只读清单 `platform.registry.list`，`get()` 回来的适配器实例不过进程边界。
  - id: platform-registry
    dependsOn: [ipc]

  # 风控观测（spec 2.7-01）：主文档响应命中判据就发一条 `browser/risk-signal`，本身不停任何东西。
  # 状态码口径在这里（换站点要改的是数），页面文案判据在知识包的 `risk` 段里（那是站点知识）。
  # 注掉这一行 = 那个唯一的 webRequest 槽位空出来：验证码页会被照常翻页，工作流不再因风控而停。
  - id: browser-risk
    dependsOn: [browser, platform-registry]
    config:
      riskStatusCodes: [403, 429]
      pageSettleTimeoutMs: 10000

  # 人工接管态（spec 5.5-01 / 02 / 09）：「这块页面此刻在谁手里」的唯一状态源，号段 21 的接管流水在它名下。
  # 它只订阅已有的两条信号（`browser/risk-signal`、`session/expired`）再外加界面上那两只按钮，不新做检测。
  # 注掉这一行**不会**得到「照常跑但不接管」——`agent-policy` 与 `agent-loop` 把它列成硬依赖，两个插件一起
  # 不进装配。这是刻意的：读不到接管态还照动手，等于「接管期间一步都不发」少一行配置就静默失效。
  - id: browser-takeover
    dependsOn: [store]

  # 工作流节点执行器登记处（spec 2.4-01 / 2.4-08）：`kind` → 执行函数的表，本身不含任何站点知识。
  # 各能力包在自己的服务里把节点登记进来，与 `platform-boss` 登记进 `platform.registry` 同一个手法，
  # 于是 `workflow` 一行代码都不认识平台包（plan §11.3 第 5 条）。内置只有两只演示节点：`demo.flaky`、`demo.branch`。
  # **必须排在一切登记方之前**（2.5-e 起有两个：`jd-capture` 与 `outbound-greet`）：装配是「按清单顺序
  # 逐个 await 挂载」（kernel `assemble()`），那两个服务在自己的 `[Service.init]` 里取登记处来登记节点，
  # 取不到就没人登记 `jd.capture` / `greeting.send`。它自己没有任何依赖，所以放多早都不会 PENDING。
  # 反过来不给登记方加硬 `inject`——工作流没装时抓取/打招呼本身不该跟着启动失败，只是「节点没人能跑」。
  - id: workflow-executors

  # 打招呼编排（spec 2.5-02 / 03 / 04 / 09 / 10 / 13）：幂等 → 内容 → 黑名单 → 额度 → 频控 → 发送 → 落账，
  # 全应用唯一的外发口（AGENTS.md §7.3），界面与工作流节点都汇到这一个 `perform`。
  # 它自己不认识任何平台，也不保存平台的手：每次外发都向 `platform.registry` 现问一条渠道（契约
  # `GreetChannelSource` 在 core，plan §12.12 第 1 条 / §12.13）。因此它只排在**登记处**之后，
  # 不再需要排在 `platform-boss` 之前——适配器晚一点登记进来也立刻可用，这是换成问法买到的性质。
  # 摘掉这一行：`platform-boss` 照常挂载（它不再向本服务登记东西），而 `greeting.send` 节点
  # 得到「执行器未登记」的结构化失败——而不是静默少发一条。
  # 注掉 `platform-registry`：本服务连同进 PENDING（它的 `inject` 里有），界面上的外发口给出结构化错误。
  - id: outbound-greet
    dependsOn: [entitlement, outbound-script, outbound-throttle, platform-registry]

  # 投递记录（spec 3.7-02）：`delivery_records` 表的唯一落点，迁移号段 9。一次确认送达的投递一行，
  # 记「递给哪个 JD、用的是哪一版快照」，与号段 1 的 `usage_ledger` 以 `ledger_id` 一对一相连——
  # 额度与经过分列两表：账本永远只回答「今天用掉几个」，投递域不必把计数背成第二套状态（AGENTS.md §2.7）。
  # 摘掉这一行，下面的 `outbound-deliver` 连同进 PENDING（它的 `inject` 里有它）：
  # 宁可递不出去，也不要「递出去了但事后说不清递的是哪一版」。
  - id: outbound-delivery-records
    dependsOn: [store]

  # 简历投递编排（spec 2.6-01…07）：打招呼的下游，复用同一条闸门/账本/频控，只多「等人确认」这一段。
  # 档位显式写在这里而不是藏在代码默认值里：2.6-01 的验收要在装配面板现场改 `suggest / semi / auto`
  # 并看着行为变，而默认值必须是 `semi`——默认 `auto` 等于装好 app 就往真实站点上自动递简历。
  # 摘掉这一行：`resume.deliver` 节点得到「执行器未登记」的结构化失败；上一行摘掉则投递照旧、打招呼没了。
  # `resumeFile` 是 P3（简历 PDF 生成）之前的临时默认路径，请求里带 `filePath` 时以请求为准（plan §13.5）。
  # 择机投递（spec 5.7-03）在真实装配里**显式打开**：代码默认关（plan §7.5.5 决策七第 2 条——已验收的 2.6 主线
  # 不该在没人设置的情况下改行为，也不该让测试套件变成时间依赖），但无人值守那一路本就该受时间窗与回复状态约束。
  # 这里刻意不加 `dependsOn: jd-store`：规则只往那个包**现问**回复状态（§9 的"不存第二份事实"），它没挂载时
  # 规则得到「问不到」并按保守起见不递，而不是把整个投递服务拖进 PENDING——递不了与不该递是两回事。
  - id: outbound-deliver
    dependsOn: [entitlement, outbound-throttle, outbound-delivery-records, platform-registry]
    config:
      autonomy: semi
      approveTimeoutMs: 120000
      maxResumeBytes: 5242880
      timing:
        enabled: true

  # BOSS 适配器（spec 2.2-06 / 2.2-08）：站点知识全在 `packages/platform-boss/src/knowledge/boss.json`，
  # 本包挂起来时把自己 `register` 进上一行——`browser` 与 `workflow` 因此一行代码都不改。
  # 注掉这一行，界面上的平台清单立刻少一项，`platform.registry.get('boss')` 得到 `PLATFORM_NOT_REGISTERED`，
  # 打招呼那一路也同时失去渠道（`outbound.greet` 现问现取，返回 `OUTBOUND_CHANNEL_MISSING`）。
  # 想用外部知识文件验证「改数据不改代码」：给 `packFile` 填一个绝对路径（2.6 走这条口）。
  # 2.5-d 起它还要 `browser.act` 那三只手（敲字 / 点击 / 等文本变化）才打得招呼，只读定位不再够用。
  - id: platform-boss
    dependsOn: [platform-registry, browser, browser-act]

  # 会话消息库（spec 2.5-07）：`conversation_messages` 表由本服务自己把迁移 push 进 `store.migrations`，
  # 号段取 5（账本 1、agent 会话 2、jobs 3、workflow run 4）。表形状是通用的，读它的那只手是平台的，
  # 所以它和 `jd-store` 一样待在平台包里（plan §12.10 第 1 条）。
  # **不**依赖 `platform-boss`：摘掉适配器时本服务照样挂载（`list` / `status` 读的是已落库的真相），
  # 只有 `syncFrom` 会得到 `PLATFORM_NOT_REGISTERED` 的结构化失败——「读不到页面」与「库里没有会话」是两件事。
  - id: conversation-store
    dependsOn: [store, platform-registry]
    config:
      platform: boss

  # 工作流落库（spec 2.4-05 / 2.4-10）：`workflow_runs` / `workflow_nodes` 两张表由本服务自己把迁移
  # push 进 `store.migrations`，号段取 4（`usage_ledger` 1、`chat` 2、`jobs` 3 —— 号段全局，撞号在运行期才炸）。
  # 摘掉这一行，`workflow` 连同进 PENDING：界面上读不到任何 run 状态，而不是「跑完了但没记录」。
  - id: workflow-store
    dependsOn: [store]

  # 画布图读写（spec 5.10-10 / 5.10-17）：`workflow_plans` 的 `graph_json` / `views_json` / `revision` /
  # `is_custom` 四列由 `workflow-store` 在同一份迁移清单里 push（号段 28），本行只提供 load / save 两个方法
  # 与保存前的五条图校验硬拦。注掉它，画布打不开任何计划，而计划列表与 run 进度照旧——
  # 「能编辑」与「能跑」是可分别摘掉的两件事，不是一套塌了另一半还假装正常。
  - id: workflow-graph
    dependsOn: [ipc, workflow-store]

  # JD 库（spec 2.3-02 / 2.3-04 / 2.3-05）：`jobs` 表由本服务自己把迁移 push 进 `store.migrations`，
  # 号段取 3（`usage_ledger` 1、`chat` 2 —— 号段是全局的，撞号在运行期才炸）。
  # 摘掉这一行，`jd-capture` 连同进 PENDING：界面点「搜索并入库」得到结构化错误而不是静默不入库。
  - id: jd-store
    dependsOn: [store]

  # 抓取编排（spec 2.3-01 / 2.3-06…2.3-11）：滚动收集 → 逐条读详情 → 落库。
  # `targetCount` 是「抓够就停」的判据、`maxRounds` 是不死循环的硬上限，两者都写进清单而不是代码里（§2.7）。
  # 轮间停顿**不在这里**：节奏唯一出口是 `outbound.throttle`（spec 2.7-04），所以依赖里带上它。
  # 依赖里还带 `entitlement`（spec 2.7-03）：一次抓取 run 现在过闸门并占一条 `search` 额度。
  # 注掉 `entitlement` 这一行：本服务连同进 PENDING，界面点「搜索并入库」得到结构化错误，
  # 而不是「额度体系塌了但抓取照跑」——那正是 §7.3 要防的绕过。
  - id: jd-capture
    dependsOn: [platform-boss, browser, jd-store, usage, outbound-throttle, entitlement]
    config:
      platform: boss
      targetCount: 20
      maxRounds: 8

  # 工作流执行器（spec 1.10 → 2.4-01/02/05/06/10）：槽位来自**计划**（`planId` 选 `WORKFLOW_PLANS` 里的一条），
  # 执行函数来自 `workflow-executors` 登记处，每一步的开始/结束/失败同时写进 `workflow-store` 的两张表。
  # 依赖里带 store：run 状态必须是重启后还在的真相，而不是一次性的内存镜像。
  # **不**依赖 entitlement：`boss-basic` 的三个节点是 read / read / local-write，没有真实外发（§7.3 的约束
  # 在 2.5 打招呼、2.6 投递接进来时生效，届时那两类的 `effect: outbound` 节点会走闸门）。
  # 演示退避与续跑：在装配面板改 `retryTimes` / `retryBackoffMs`（不重启 app），或注掉 `workflow-executors`
  # 让 `jd.capture` 无人登记——界面得到的是「执行器未登记」的结构化失败，而不是静默空转。
  - id: workflow
    dependsOn: [ipc, workflow-store, workflow-executors]
    config:
      planId: boss-basic
      retryTimes: 2
      retryBackoffMs: 500
      retryBackoffCapMs: 5000
      maxNodesPerRun: 20
      evidenceDomChars: 800
      evidenceTextChars: 300
      evidenceDir: evidence
      retentionRuns: 20

  # 简历文档存储（spec 3.1-08 / P3 生成轨地基）：`resume_docs` 表由本服务自己把迁移推进（号段 7）。
  # 只落库、不渲染：3.2 模板与 3.3 打印轨都从这张表读同一份合法文档。依赖里带 store 即可，
  # 无运行期配置（Schema 是空 strictObject）。摘掉它，后续任何按 id 读简历文档的入口得到结构化失败。
  - id: resume-doc
    dependsOn: [store]

  # 导出快照（spec 3.7-01）：`resume_snapshots` 表由本服务自己把迁移推进（号段 8，账本 1…consent 6、resume_docs 7）。
  # 每次 `resume.export` 成功后记一行不可变快照，供 3.7-04 按 id 还原、3.7-02 投递追溯读取。
  # `maxSnapshots` 是每份文档的保留上限（3.7-05）：显式写在这里而不是藏在代码默认值里，演示「写了 N+1 份只留最新 N 份」
  # 能在装配面板现场改小、不重启 app。摘掉这一行，下面的 `resume-export` 连同进 PENDING（它的 `inject` 里有它）。
  - id: resume-snapshot
    dependsOn: [store]
    config:
      maxSnapshots: 20

  # 导出编排（spec 3.3-11）：读合法文档 → 装配打印请求 → 交给 `resume.print` 端口渲染 → 落盘 + 回写页数 → 记快照，
  # 收敛成 `resume.export` 服务。它自己**不认识 Electron**（L2 领域包），只经端口消费打印能力（ports-and-adapters，plan §3.3）。
  # 四条 `dependsOn` 各对应一种「装不上就报结构化错误」的演示：摘 `resume-doc` 读不到文档、摘 `resume-print` 无人渲染、
  # 摘 `resume-snapshot` 导不成（导出即留档被拆成可单独摘的一环）、摘 `config` 拿不到 userData 落盘目录——四者都让本服务连同 PENDING，而不是崩在运行期。
  - id: resume-export
    dependsOn: [resume-doc, resume-print, resume-snapshot, config]

  # 排版编辑器（spec 3.6 / plan §8.3）：`resume.editor` 持有"正在编辑的那一份 draft + 撤销历史"，
  # 因为简历正文不过进程边界（见 `bridge.ts` 里 3.3 那段注释立的口径），编辑动作只能发生在主进程这一侧。
  # 它不建表、不落盘：draft 只活在内存里，重启即失（plan §8.5 裁定⑨「只拦不存」），保存走 `resume.doc` 那唯一的写入入口。
  # 排在 `resume-doc` 之后是 §9 的 5.1-c（清单顺序就是挂载顺序）；摘掉这一行，界面九条 `resume.editor.*`
  # 得到「服务未挂载」的结构化失败，而预览与导出照旧——「排一版」与「印一版」分属两件事。
  - id: resume-editor
    dependsOn: [resume-doc, resume-print]

  # 简历导入（spec 4.1-06 / 07 / 09 / 10）：`resume_imports` 表由本服务自己把迁移推进（号段 10，
  # delivery_records 是 9），也是 PDF / DOCX / Markdown 三条输入腿在桌面端的唯一入口。
  # `maxBytes` 是单次导入的字节上限（防误选大文件把主进程吃掉），显式写在这里而不是藏在代码默认值里，
  # 演示「选了一份 20 MB 的文件」能在装配面板现场改小、不重启 app。
  # 抽取与判定全在 `@auto-cc/plugin-resume-kb` 内部（pdf.js / mammoth 是外置依赖，见 1.7-15），不认识导出轨。
  # `dependsOn: resume-doc` 是 plan §1.4 裁定一：解析出的文档要经 `resume.doc` 落成可编辑工作副本，
  # 否则 3.x 的编辑与 PDF 导出读不到导入的内容。摘掉 `resume-doc` 这一头，本服务连同 PENDING（不是崩在运行期）；
  # 摘掉本行，界面「导入简历」得到「服务未挂载」的结构化失败，导出照旧。
  - id: resume-parse
    dependsOn: [store, resume-doc]
    config:
      maxBytes: 5242880

  # 知识库实体建模（spec 4.2-01 / 02 / 03）：`kb_entities` 表（号段 11，紧随 resume_imports 的 10）的唯一落点。
  # 实体从 `resume_docs` 的**当前工作副本**派生（plan §1.4 裁定一/二），所以它依赖 `resume-doc` 而不是
  # `resume-parse`——出处表不参与派生，派生只看可编辑的那一份。
  # 4.2-a 阶段它还没有界面调用方（面板与 agent 工具在 4.2-d 接），但表与迁移必须先在真实 app 里就位，
  # 否则 4.2-d 的界面只能对着内存假数据验收。
  # 反查阈值显式写出（4.2-03 / 同 4.3-03「代码内无魔法数」）：4.5 按岗位松紧调这两个数时只改这里，不发版。
  - id: kb-profile
    dependsOn: [store, resume-doc]
    config:
      evidenceTopK: 5
      evidenceMinScore: 0.34
      # 本地检索（spec 4.3-01 / 02 / 03）：BM25 的两个参数与两条腿的权重全部在这里，代码内无魔法数。
      # 默认值是 Okapi 惯用值，实测（docs/acceptance/4.3/）换档只改分值不改头部次序，
      # 所以 4.3-e 做评测集标定时的动作就是调这一处而不是改代码。
      searchTopK: 10
      searchMinScore: 0.2
      bm25K1: 1.2
      bm25B: 0.75
      bm25Weight: 0.6
      lexicalWeight: 0.4
      substringFloorScore: 0.25
      # 向量增强（spec 4.3-07 / 08）：RRF 的阻尼常数与向量腿自己的余弦下限。
      # 不进 `dependsOn: [llm-embed]` 是有意的——向量腿是**可选增强**，摘掉那行插件检索照样跑
      # （`vectorStatus: unavailable`），硬依赖会让知识库插件跟着对话/向量网关一起 PENDING。
      # `rrfK` 60 是信息检索的惯用值；`vectorMinCosine` 的 0.35 是待标定的占位（4.3-e 评测集动这两处而不是改代码）。
      rrfK: 60
      vectorMinCosine: 0.35

  # JD 能力要求拆解（spec 4.4-01 / 4.4-02 / 4.4-06，4.4-a 词面腿 + 4.4-b 模型腿）。
  # 没有 `dependsOn`：本服务只吃一段 JD 正文、吐四类带原文位置的要求，不建表、不读库；
  # 模型腿经 `chatGatewayOf` **在用的时候现问** `llm.chat`（spec 4.4-02 的软依赖），
  # 所以既不写 dependsOn、也不写 inject——写了就会变成「摘掉 llm 包连带让 kb-gap 降 PENDING」，
  # 而这一条要的恰恰是"没有模型时词面拆解照常"（AGENTS.md §9 的 2.5 实测条同样禁止把读数存成第二份事实）。
  # plan §4.4 口径 3：拆解是可重建的纯派生，落库只会造出 `jobs.requirements_json` 之外的第二个真相。
  # `perKindLimit` 12 的由来：4.4-d 的分栏界面一栏十几条已经要滚动，而真实 JD 的技术名词常到 20+，
  # 截断保住的是稳定序列头部（4.4-07），丢弃条数随结果与日志一起报出（4.4-06 的"计数可见"）。
  # `minJdChars` 20 是系统边界校验：短到这个数基本是粘贴错了或详情页没加载完，拆不出可信要求。
  # `allowModelLeg` 默认开；关掉后本服务只做词面拆解并在结果里报 `disabled`（离线演示与额度闸门 4.4-e 的开关位）。
  # `modelMaxTokens` 1200 只约束"四类型别 × 每类 12 条"的清单，比话术生成的 400 宽；
  # `modelTemperature` 取 0（不是话术那边的 0.7）：拆解是读数不是创作，温度非 0 会让同一份 JD 两次拆出不同清单。
  # 4.4-c 起这六项是**比对腿**的尺子（plan §4.4-c 判据一/二）：`evidenceHitMinScore` 与
  # `evidencePartialMinScore` 决定技能类的三态分界，`yearsPartialRatio` 0.6 是「差多少算部分够」，
  # `highlightMinScore` 是亮点候选与 JD 全文的第二道闸（只判「JD 没提」会把驾照推成差异化优势），
  # `maxHighlights` 6 与 `evidenceTopK` 3 管界面一栏放几条。
  # 4.4-e 已按人判标注集标定其中三条测量型阈值（这一段就是当初说的"只改这一段，不改代码"）：
  # 0.62 → **0.58**（(0.5, 0.6667] 空带的中间，两侧各 0.08 余量，不贴着任何一条样本）；
  # 0.3 → **0.33**（0.25 那档是四条 token 对上三条的词面巧合，必须留在缺失侧；代价是 0.3333 这一档
  # 同时装着人判「部分命中」与「缺失」各一条，任何阈值都分不开，标定报告里如实列成翻脸条目）；
  # 0.12 → **0.11**（可行带上唯一的网格点：不相关侧最高 0.1、相关侧最低 0.1111，0.12 会把
  # 「MySQL 分库分表」这类明写岗位技术的实体压掉）。
  # 语料 `packages/resume-kb/src/gap-calibration-corpus.ts`（29 + 13 条），选值
  # `gap-calibration.ts`，回归锁 `gap-calibration.test.ts`（改这三个数不重跑标定即发红），
  # 逐条读数与翻脸清单入档 docs/acceptance/4.4/4.4-e-threshold-calibration.txt。
  # 另两条（`yearsPartialRatio` / `maxHighlights`）是口径型，不进标定——理由同在 plan §4.4-e 判据三。
  - id: kb-gap
    config:
      perKindLimit: 12
      minJdChars: 20
      allowModelLeg: true
      modelMaxTokens: 1200
      modelTemperature: 0
      evidenceTopK: 3
      evidenceHitMinScore: 0.58
      evidencePartialMinScore: 0.33
      yearsPartialRatio: 0.6
      highlightMinScore: 0.11
      maxHighlights: 6

  # 定向内容生成（spec 4.5-01 / 05 / 09 / 10 / 12）。它 `inject` 的是 `store` 与 `resume.doc`——
  # 读工作副本、往 `resume_generations`（新号段 **15**）落一行记录，这两件事之外它不碰任何持久化。
  # 与 `kb-gap` 同一条纪律：**不 `inject` `kb.gap`、也不 `dependsOn` `llm`**，相关性读数与模型出口都是
  # 用的时候按名字现问（§9 实测 2.5 的教训 + plan §4.5 取证四）。于是摘掉 `kb-gap` 那一行，
  # 本服务照常挂载、调用时给出 `KB_LIBRARY_MISSING` 的"功能不可用"，而不会连带降成 PENDING——
  # 「重排要有据可依」是产品要求，不是装配要求。
  # 顺序排在 `kb-gap` 之后：init 那行日志要报"缺口腿已装配/未装配"，先挂缺口腿才报得准。
  # `allowModelLeg` 默认开；关掉即 4.5-09 的纯本地路径（仅重排、字段照抄），产物照样合法，
  # 只是 `modelStatus` 报 `disabled` 并一路带到界面上——降级必须看得见（与 4.6-06 同一口径）。
  # `modelTemperature` 取 0（不是话术那边的 0.7）：同一份简历 + 同一份 JD 两次生成必须出同一份改写清单，
  # 否则 4.5-10 的复盘分不清"模型改了"与"温度抖了"（理由与 `kb-gap` 那一处完全相同）。
  # `modelMaxTokens` 2000 比拆解的 1200 宽一档：拆解只回一列短句，这里回的是**整段散文**，
  # 而 `maxRewriteChars` 600 只管单段上限、不限段数。超限会被读成非法 JSON 而按 `failed` 回落成仅重排，
  # 也就是"最坏情况是这一次没有改写"，不是"这一份简历坏了"。
  # `maxRewriteChars` 600 是模型跑飞时的一句保险（一整段经历成果通常在 200 字以内）。
  - id: kb-generate
    config:
      allowModelLeg: true
      modelMaxTokens: 2000
      modelTemperature: 0
      maxRewriteChars: 600

  # 轻编辑的打开腿（spec 3.4-03 / plan §7.4 的 3.5-a）：把**用户手里那份 PDF** 读进来，只回页数与每页宽高。
  # 没有 `dependsOn`：它不建表、不占迁移号段、不认识 `resume-doc`（plan §7.3 的依赖方向），
  # 读的是用户键入的绝对路径——所以摘掉上面任何一行都不影响它，摘掉这一行也只影响它自己。
  # `maxBytes` 与 `resume-parse` 同量级并显式写在这里（§4 起的口径：代码内无魔法数，演示时能在装配面板现场改小）。
  # 摘掉本行：`pdf.io.open` 给出「服务未挂载」的结构化失败，而导入轨（4.1）与导出轨（3.3）照旧——
  # 「在既有 PDF 上改」与「按文档模型排出去 / 把外部文件读成简历」是三件不同的事，各占一行。
  - id: pdf-io
    config:
      maxBytes: 5242880

  # 轻编辑的另存腿（spec 3.5-02 / 3.5-09，plan §7.4 的 `pdf.export`）：覆盖区追加到既有 PDF 上，产物另存为新文件。
  # 它同样**不建表、不 inject**：源文件按路径现读，产物写进用户给的位置，抛错时磁盘上没有半成品（plan §7.10）。
  # 五个键都是尺度而不是行为：条数上限、页数上限、默认字号、最小面积各管一条拒绝腿，代码内不留魔法数。
  # 摘掉本行：`pdf.export.saveAs` 给出「服务未挂载」的结构化失败，而 `pdf.io.open` 照旧——
  # 打开（只读）与另存（要落盘）分开摘，是因为它们在界面上的后果完全不同：前者只是看不见页数，后者是「你以为存过了」。
  - id: pdf-export
    config:
      maxBytes: 5242880
      maxOverlays: 50
      maxPages: 64
      defaultTextSizePt: 11
      minAreaRatio: 0.0001

  # 轻编辑的文本块线框腿（spec 3.5-01 / plan §7.4 的 `pdf.layout`）：源路径 + 页号 → 这一页的矩形列表。
  # 同样**不建表、不 inject、不登记 agent 工具**；页面宽高继续问 pdf-lib 那一份，pdf.js 只用来取文本项，
  # 于是线框与覆盖区永远对得上（plan §7.15 第 3 条）。回传里没有原文，`str` 在主进程侧判完空就丢。
  # 摘掉本行：`pdf.layout.textItems` 给出「服务未挂载」的结构化失败，界面上看不见线框，而打开与另存照旧。
  - id: pdf-layout
    config:
      maxBytes: 5242880

  # 对话式主界面的另一半（spec 1.11）：会话 / 消息 / 档位。`agent`（工具注册表）排在更上面，
  # 因为 2.8-08 之后登记工具的是 L2 的能力包，注册表必须比它们先挂载——理由写在那一行的注释里。
  # 演示流式速度：在装配面板改 chunkChars / chunkIntervalMs（不重启 app）。
  - id: chat
    dependsOn: [agent, store]
    config:
      chunkChars: 6
      chunkIntervalMs: 120
      # `defaultAutonomy`（新会话的起始档位，spec 5.3-02）**故意不写在这里**：它的缺省值就是最保守档
      # `suggest`，装配文件不给这一行，"配置缺失亦回落到最保守"这条判据才是被装配本身证明的。
      # 要改默认档只能在装配面板显式改（5.3-04 防的是 agent 自己升档，不是人改默认值），
      # 而会话中途的档位切换另有审计表 `chat_autonomy_audit` 记录（5.3-05）。

  # 判定口（spec 5.2-02 / 07）：循环的每一步都只向它问「现在能不能执行」。
  # 它不看模型说的话（请求里根本没有副作用那一位），也不看额度（外发工具自己经闸门，
  # 这里再问一次就是 §2.5 禁止的两套口径）。摘掉它，整条循环停在判定之前而不是照跑。
  # 5.3-b 起它依赖 store：免确认白名单与它的变更流水是**跨重启成立的用户表态**，
  # 落在号段 18 的两张表里（`agent_policy_exempt` / `agent_policy_exempt_audit`），不是配置键——
  # 装配面板写配置只改内存里的运行时层，且改本服务配置会连带重建正在跑循环的 `agent-loop`（§9 的 2.5 实测）。
  - id: agent-policy
    dependsOn: [agent, store, browser-takeover]

  # 暂停通道（spec 5.3-08 / 09 / 10）：「这一步要人表态」时唯一的等待处——确认单与补充信息单共用它，
  # 单号路由、超时＝未确认＝不执行、销毁收单这三条性质长在 `@auto-cc/core` 的 `PendingChannel` 上。
  # 不建表也不占迁移号段：待决暂停是**等待状态**而不是事实记录，经过落在 `agent_step` 与 `agent_run.stop_reason`。
  # 无依赖：它只认「单号 + 人给的值 + 时刻」，不认识 run 也不认识注册表（谁都能开单，应答只按 id 路由）。
  # `pauseTimeoutMs` 写在这里而不是代码里（4.x 起的同一条口径：代码内无魔法数）。
  # **改这一格会连带重建 `agent-loop`**（它 inject 本服务，§9 的 2.5 实测）：可接受的前提是销毁时收单——
  # 在等的卡全部按「未表态」定局、那条 run 停在安全点并写明原因，绝不留一个悬着的 `await`，也绝不放行。
  - id: agent-pause
    config:
      pauseTimeoutMs: 120000

  # 对话循环（spec 5.2-01 / 05 / 08 / 11）：`agent_run` + `agent_step` 两张表由本服务把迁移
  # push 进 `store.migrations`，号段取 16（账本 1、会话 2、jobs 3、workflow run 4…生成记录 15）。
  # 模型腿是确定性桩（`loop/model.ts`）：真模型出网要花钱且须用户单独授权，本片不接。
  # 两条上限就是 5.2-11 的判据对象，在装配面板里改了就生效（改配置会重建本服务并清空内存作用域，
  # 进度因此一律从库里的 run/步行重建——见 `ensureScope` 的注释）。
  - id: agent-loop
    dependsOn: [agent, agent-pause, agent-policy, chat, store, browser-takeover]
    config:
      stepLimit: 12
      tokenBudget: 4000
      contextCharsCap: 1200
      # 5.5-03 的重读口**接线**（不是业务映射）：循环不认识浏览器，只按这个名字现问注册表，
      # 并且只认声明里 `effect === 'read'` 的那只手。写成一只动手的手会响亮失败
      # （`AGENT_LOOP_REREAD_UNAVAILABLE`），循环不会借着「重读」的名义在页面上按一下。
      rereadToolId: browser.page.snapshot
      # 5.5-04 的自转保险丝：一条 run 里最多把几步换成另一只手，用完就停在安全点报
      # `REPLAN_EXHAUSTED`（0 表示从不重规划：落空即停，把原因交回给人）。
      replanLimit: 2

  # 对话 → 工作流沉淀（spec 5.4-01 / 02 / 09）：把一次跑通的对话**投影**成工作流计划的唯一口，
  # 自己不建表——计划落库经 `workflow.runner.savePlan`（名字校验与指纹重算都只在那一处，§2.5）。
  # 注掉这一行：预览卡与「沉淀为工作流」按钮给出「服务未挂载」的结构化失败，
  # 而对话、循环、工作流三条照旧——「跑成过一次」与「固化成以后每次都这么跑」是可分别摘除的两件事。
  # 它只 `inject` `agent.loop`；对 `workflow.runner` 是**用的时候现问**（§9 的 2.5 实测：
  # 热改配置会重建下游，存第二份引用就会在改配置后静默变空）。
  - id: agent-sediment
    dependsOn: [agent, agent-loop]
    config: {}

  # 按引用回看（spec 5.7-02 / plan §7.5.7 决策十一）：对话卡片上一条证据引用的唯一读数口。
  # 一只口而不是每种前缀各一只：路由表只许住在主进程这一侧，界面只负责画 `EvidenceRefView` 那个外壳。
  # 只读、不建表、不占号段；归属服务（用量账本 / 岗位库 / 工作副本 / 导入 / 生成 / 知识库 / 快照）
  # 全部经 `maybeService` 按名字现问，所以摘掉任何一条能力腿都不会把它一起带进 PENDING，
  # 只会在点开那一条引用时给出一句「那个服务此刻没有挂载」的确定读数（§9 的 2.5 实测）。
  # 注掉这一行：卡片上的引用点不开、给出「服务未挂载」的结构化失败，而对话、循环、卡片流照旧。
  - id: agent-run
    dependsOn: [agent, agent-loop]
    config: {}

  # 指标看板的唯一数据源（spec 5.8-01 / 02 / 03 / 04 / 05，plan §7.6.2 决策十六）：漏斗五级 + 额度三量的
  # **只读聚合口**。它自己不写一行 SQL、不建表、不占迁移号段——每张表仍由自己的主人去数，
  # 归属服务（岗位库 / 会话库 / 用量账本 / 投递记录 / 闸门）全部经 `maybeService` 按名字现问，
  # 所以摘掉任何一条能力腿都不会把它一起带进 PENDING，只会在查那一级时给出一句「此刻没有挂载」的确定读数
  # （与上面 `agent-run` 同一口径，§9 的 2.5 实测禁止在本地存第二份事实）。
  # 注掉这一行：看板整块得到「服务未挂载」的结构化失败，而对话、循环、投递照旧——
  # 「每一级各有数」与「有一个地方把它们拼成一张看板」分属两条。
  # 没有 `dependsOn`：只读聚合不需要任何一侧先挂载，顺序对它的读数没有影响（现问发生在被调用的那一刻）。
  - id: funnel
    config: {}

  # 更新通道（spec 5.9-03）：**默认没有更新源**——`feedUrl` 缺省即 `no-feed`，一次请求都不发，
  # 这条默认值本身就是判据的一部分（"默认不指向 GitHub 直连"，plan §7.7.2.1 第 3 条 + §9 的网络事实）。
  # 要接自建镜像时在这里补 `feedUrl: https://…/generic/`；`forceDevUpdateConfig` 只为取验收证据时开。
  - id: update
    config:
      forceDevUpdateConfig: false

  # 定时任务登记处（spec 5.7-05 / 06 / 09 / 10）：`schedule_jobs` + `schedule_triggers` 两张表的唯一落点（号段 25），
  # 进程内一个 `setInterval`，不注册任何操作系统的计划任务（判据由 `scripts/check-scheduler-no-external-cron.ts` 钉）。
  # `dependsOn: workflow` 只为了**顺序**：挂载时那一次追账与之后的每个 tick 都要有起跑口在场，
  # 否则第一分钟就会落一串 `failed` 记录——那是接线顺序问题，不该写进触发史里当事实。
  # 刻意**不写** `entitlement`：额度是触发前的一次只读预检（被拒就落 `skipped` 并带闸门原话），
  # 不是装配依赖。写成依赖会让"摘掉闸门"变成"调度整个不装"，而 5.7-a 定的行为是闸门缺席时照跑、
  # 真正的三闸门在节点侧（5.3-d）——见 plan §7.5.3 决策四。
  # 注掉这一行：界面的「定时任务」一节给出「服务未挂载」的结构化失败，对话与工作流照旧——
  # 「现在跑一次」与「以后每次都在这时刻跑」分属两条。
  - id: schedule
    dependsOn: [store, workflow]
    config:
      # 一分钟一格：用户能配的表达式最小粒度就是分钟，更密只会多扫几次索引。
      tickIntervalMs: 60000

# ---------------------------------------------------------------------------
# 验收工具的读数位（**不属于插件装配**）：`parseManifest()` 只认 `plugins` 数组，多余的顶层键原样忽略
# （实测口径见 packages/kernel/src/manifest.test.ts:200 那条「缺 plugins 才报错」的例子），所以这一段
# 对运行期装配零影响。放在同一个文件里的理由是「配置只有一个入口」（AGENTS.md §2.7）——基准脚本经这一处
# 只读**它自己要用的量级与预算**，插件的运行期参数仍旧走上面 `config:` 段的分层合并解析，不在这里另开一套。
#
# spec 4.3-09：千级切片下检索 P95 必须落在 `p95BudgetMs` 之内，超预算即验收失败（脚本 exit 1）。
# 预算 150ms 的由来：这一等发生在用户敲完关键词之后，100～200ms 是"感觉不到被打断"的量级；给它留到 150
# 而不是实测值，是因为跑基准的这台机器是 NVMe + 桌面 CPU，而判据要覆盖三端装机（含机械盘的老笔记本）。
# 实测读数入档：docs/acceptance/4.3/4.3-09-p95-benchmark.txt。
#
# `chunks` 取 1500 是**远超真实负载**的压力位：一份简历派生的实体 + 三个区块切片只有数十到数百条，
# 千级相当于十几份简历一起进库（plan §4.3-e 证据 [1]）。`queries` 取 240 是为了让 P95 那一档
# 落在第 228 个样本上——样本太少（几十次）时 P95 就是最大值，读数没有意义。
bench:
  kb-search:
    chunks: 1500
    queries: 240
    p95BudgetMs: 150

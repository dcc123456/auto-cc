# 插件装配清单（spec 1.3-01）
#
# 这里是「装哪些插件、以什么顺序、带什么配置」的唯一入口：注掉一行，重启后界面插件树里
# 就确实没有它。清单只写 id，不写模块路径——主进程是 esbuild 打成单文件的，运行时按路径
# 动态 import 拿不到实现，实现由 `packages/main/src/registry.ts` 的注册表提供。
#
# `dependsOn` 决定挂载顺序；运行期的依赖等待由插件自身的 `inject` 声明负责
# （依赖缺席时 cordis 把插件留在 PENDING，见 spec 1.3-09）。
plugins:
  - id: config
    config:
      appName: auto-cc

  - id: logger
    dependsOn: [config]
    config:
      level: info
      buffer: 500
      file: auto-cc.log

  - id: store
    dependsOn: [config]
    config:
      file: store.db
      journal: wal

  # 模型出口（spec 2.5-12）：全仓**唯一**的 LLM 请求通道，`pnpm lint` 里的 `check-llm-single-entry` 守这条。
  # 默认留空 = 「未配置」：`complete()` 以 `LLM_UNAVAILABLE` 结构化失败，且一次网络都不发，
  # 所以话术生成的模板回落是**可测的**（spec 2.5-01），不是碰运气。
  # 这里不写 key：清单是入库文件，AGENTS.md §8.6 禁止把密钥写进仓库。key 只从环境变量读。
  # 要真跑模型就补两行（并导出 `AUTO_CC_LLM_API_KEY`）：
  #   baseUrl: https://api.deepseek.com
  #   model: deepseek-chat
  - id: llm

  # 外发额度骨架（spec 1.9）：账本与闸门各占一条，因为 1.9-05 要能**只摘掉闸门**而账本还活着。
  # `mode: unlimited` 是当前产品阶段的 shipped 默认——不收费、不登录、不联网校验（1.9-02 / 1.9-09）。
  # 上限是**按动作**的三条（spec 2.7-03）：抓取（一轮 run 记一条）、打招呼、投递各自计数、互不占用，
  # 所以 `search: 40` 不会因为抓了 40 轮就把打招呼饿死。想演示超限就在调试面板把该插件配置改成
  # `mode: daily` + 对应动作 `1`（1.9-03，不重启 app）；三个键都写在这里而不是藏进代码默认值，
  # 是为了让「今天还能搜几次」在现场读得到。
  - id: usage
    dependsOn: [store]

  - id: entitlement
    dependsOn: [usage]
    config:
      mode: unlimited
      dailyLimits:
        search: 40
        greet: 20
        deliver: 10

  # 闸门之外的最薄外发消费者：它只把闭包交给 `gate.perform()`，所以清单里注掉 `entitlement`
  # 之后，这条也会跟着进 PENDING —— 界面点「外发样例」得到的是结构化错误，而不是静默成功。
  - id: outbound
    dependsOn: [entitlement]

  # 话术生成（spec 2.5-01 / 09 / 10）：外发域的"内容侧"，与上面那条"传输侧"分开，
  # 因为它依赖的是模型出口而不是闸门。摘掉 `llm` 时这条进 PENDING、外发样例照旧能发；
  # 模型未配置时它照样挂载，只是每次生成都以模板回落并在结果里带上回落原因（界面据此播报）。
  - id: outbound-script
    dependsOn: [llm]

  # 节奏节流（spec 2.5-04 / 2.5-05 / 2.7-04）：只回答「隔多久」，不持有计时器也不计数——
  # 日上限仍归 `entitlement`，真正 await 由调用方用 core 的 `sleep` 做（plan §12.3 要避免的是第二套配额与第二套调度器）。
  # 两组区间：外发之间（打招呼/投递）与页面动作之间（抓取滚一轮、读一条详情）。
  # 显式写在这里而不是藏在代码默认值里：演示「非固定节奏」要能在装配面板现场改宽改窄，不重启 app。
  - id: outbound-throttle
    config:
      minGapMs: 45000
      maxGapMs: 150000
      scrollMinGapMs: 300
      scrollMaxGapMs: 900

  # IPC 网关（spec 1.4-01）：全应用唯一的跨进程通道，所以排在 shell 之前——
  # 窗口由 shell 创建，界面能发起调用时处理器必须已经在位。
  - id: ipc
    dependsOn: [logger]

  # 插件运行时管理（spec 1.5-01…08）：启停、热重载、错误历史、泄漏巡检。
  # 这里**不写** `dependsOn: [kernel]`——清单拓扑只认清单内的 id，而 `kernel` 是主进程直接
  # 挂的装配器；运行期依赖由插件自身的 `inject = ['kernel']` 负责。也不依赖 `config`：
  # 1.5-04 要演示「停掉 config → log/store 降级」，管理器必须活得比被停的对象久。
  - id: plugins
    dependsOn: [ipc]
    config:
      guarded: [kernel, ipc, plugins]
      history: 20

  # 可视自测通道的主进程侧读数（spec 1.6-01 / 1.6-06）：只读，不导航、不注入，
  # 因此不需要窗口先建好——它读的是 `webContents.getAllWebContents()`，界面首屏调用时已有目标。
  - id: devtools
    dependsOn: [ipc]

  # 工具注册表与对话接线面（spec 1.11 / 2.8-08）：`agent.tools` 是**登记处**，登记由各能力包
  # （`sessions` / `browser` / `platform-boss` / `outbound`）在自己的 init 里发起，所以本行必须排在
  # 它们**之前**——清单顺序即挂载顺序，晚挂载的注册表会让每一次登记都打在「注册表未挂载」上，
  # 界面上得到的是空清单，而不是一句 `TOOL_NOT_REGISTERED`（各服务的就绪日志会显式报 0 个）。
  # 为什么用顺序而不是 `dependsOn: [agent]`：那会把浏览器层 / 会话层 / 外发层绑成对话插件的下游，
  # 「在装配面板里单独摘掉 agent」就会连带把 L2 全部降为 PENDING，而插件可单独摘是 1.5-03/04
  # 已经验收过的行为，本片不悄悄改掉它（代价与补偿见 plan §15.7 落点 2）。
  # `chat` 依赖 store：会话与消息必须重启后还在（1.11-08），两张表的迁移号段取 2（plan §8.4 决策 6 更正）。
  - id: agent
    dependsOn: [ipc]

  - id: shell
    dependsOn: [plugins]

  # 打印执行器（spec 3.3）：全仓**唯一**调 `webContents.printToPDF` 的地方，落在 L1 shell 包（它是唯一认识 Electron 的层）。
  # 排在 shell 之后：它挂的是 shell 服务的进程，与 Electron app ready 同期就位。摘掉这一行，
  # 下面的 `resume-export` 连同进 PENDING（它的 `inject` 里有 `resume.print`），界面点「导出 PDF」给出结构化错误——
  # 「渲染层无 electron」这条边界因此是可演示的：L2 的 resume-doc 永远拿不到 BrowserWindow，只能通过这个端口要一次渲染。
  - id: resume-print
    dependsOn: [shell]

  # 内置内核会话（spec 1.8）：每个平台一份 `persist:<id>` 分区，登录态落 userData。
  # 排在 shell 之后：它要请 shell 按指定分区重建内嵌视图（视图宿主唯一，见 plan §8.3 决策 1）。
  # 这里只配本地 fixture —— 三个分区指向同一个服务的三条路径，用来证明 cookie 互不共享；
  # `boss` 的起始地址是**本地仿站**（`/boss`），不是 zhipin.com：AGENTS.md §7.2 规定自动化一律打本地站点，
  # 真实平台只在用户在场时手动验证（spec 2.3-10），届时改这一行 startUrl 即可，代码路径不变。
  - id: sessions
    dependsOn: [shell]
    config:
      platforms:
        - id: fixture
          startUrl: http://127.0.0.1:10233/
          sessionCookieName: autocc_session
        - id: fixture-alt
          startUrl: http://127.0.0.1:10233/alt
          sessionCookieName: autocc_session
        - id: boss
          startUrl: http://127.0.0.1:10233/boss
          sessionCookieName: autocc_session

  # 页面操作入口（spec 2.1）：导航与快照，2.2 起在同一条注入通道上加点击/输入/定位。
  # 排在 sessions 之后：它不拥有分区，只在「会话已经打开」的那块视图上做事（未打开时结构化失败）。
  # 服务名是 `browser.page`（`域.能力` 约定），清单 id 用短名 `browser`——与 usage/entitlement 同一种关系。
  - id: browser
    dependsOn: [sessions]
    config:
      navigateTimeoutMs: 10000
      snapshotTextLimit: 4000
      # 批量抽取的两道上限（spec 2.3-01）：一屏回传多少张卡、每个字段带回多少字。
      # 写成配置是为了在装配面板上把 `extractRowLimit` 调到 3，看界面如何如实报告「被截断」。
      extractRowLimit: 12
      extractTextLimit: 4000

  # 定位层（spec 2.2-01…05）：页面只回读候选，打分、去重、判歧义、指纹自愈全在这条服务里。
  # 阈值写成配置而不是常量：2.2-02 要能在装配面板上把 `minScore` 调到 100 看界面如何拒绝猜测。
  # 注掉这一行后，`browser-act` 连同进 PENDING（它的 `inject` 里有 `browser.locate`）。
  - id: browser-locate
    dependsOn: [browser]
    config:
      minScore: 70
      minMargin: 12
      candidateLimit: 5
      textNormalizationLimit: 80

  # 动作层（spec 2.2-03 / 2.2-10 / 2.2-12 / 2.2-13）：等待 → 定位 → 折算坐标 → 下发 → 回读。
  # `cdpInputEnabled: false` 是显式降级开关——界面与日志会一起改口成 dom / trusted:false，
  # 而不是静默地用不受信事件冒充真实点击。
  - id: browser-act
    dependsOn: [browser-locate]
    config:
      waitForTimeoutMs: 5000
      stableCheckSamples: 2
      waitCheckMs: 100
      cdpInputEnabled: true
      # 文件注入后的回读窗口（spec 2.6-04）：这两个数原来是注入脚本的默认实参，2.7-04 把它们搬到配置面。
      uploadReadbackMs: 1500
      uploadReadbackStepMs: 50

  # 平台登记处（spec 2.2-07）：内核唯一认识站点的入口，本身不含任何站点知识。
  # 渲染层只拿得到只读清单 `platform.registry.list`，`get()` 回来的适配器实例不过进程边界。
  - id: platform-registry
    dependsOn: [ipc]

  # 风控观测（spec 2.7-01）：主文档响应命中判据就发一条 `browser/risk-signal`，本身不停任何东西。
  # 状态码口径在这里（换站点要改的是数），页面文案判据在知识包的 `risk` 段里（那是站点知识）。
  # 注掉这一行 = 那个唯一的 webRequest 槽位空出来：验证码页会被照常翻页，工作流不再因风控而停。
  - id: browser-risk
    dependsOn: [browser, platform-registry]
    config:
      riskStatusCodes: [403, 429]
      pageSettleTimeoutMs: 10000

  # 工作流节点执行器登记处（spec 2.4-01 / 2.4-08）：`kind` → 执行函数的表，本身不含任何站点知识。
  # 各能力包在自己的服务里把节点登记进来，与 `platform-boss` 登记进 `platform.registry` 同一个手法，
  # 于是 `workflow` 一行代码都不认识平台包（plan §11.3 第 5 条）。内置只有 `demo.flaky`。
  # **必须排在一切登记方之前**（2.5-e 起有两个：`jd-capture` 与 `outbound-greet`）：装配是「按清单顺序
  # 逐个 await 挂载」（kernel `assemble()`），那两个服务在自己的 `[Service.init]` 里取登记处来登记节点，
  # 取不到就没人登记 `jd.capture` / `greeting.send`。它自己没有任何依赖，所以放多早都不会 PENDING。
  # 反过来不给登记方加硬 `inject`——工作流没装时抓取/打招呼本身不该跟着启动失败，只是「节点没人能跑」。
  - id: workflow-executors

  # 打招呼编排（spec 2.5-02 / 03 / 04 / 09 / 10 / 13）：幂等 → 内容 → 黑名单 → 额度 → 频控 → 发送 → 落账，
  # 全应用唯一的外发口（AGENTS.md §7.3），界面与工作流节点都汇到这一个 `perform`。
  # 它自己不认识任何平台，也不保存平台的手：每次外发都向 `platform.registry` 现问一条渠道（契约
  # `GreetChannelSource` 在 core，plan §12.12 第 1 条 / §12.13）。因此它只排在**登记处**之后，
  # 不再需要排在 `platform-boss` 之前——适配器晚一点登记进来也立刻可用，这是换成问法买到的性质。
  # 摘掉这一行：`platform-boss` 照常挂载（它不再向本服务登记东西），而 `greeting.send` 节点
  # 得到「执行器未登记」的结构化失败——而不是静默少发一条。
  # 注掉 `platform-registry`：本服务连同进 PENDING（它的 `inject` 里有），界面上的外发口给出结构化错误。
  - id: outbound-greet
    dependsOn: [entitlement, outbound-script, outbound-throttle, platform-registry]

  # 投递记录（spec 3.7-02）：`delivery_records` 表的唯一落点，迁移号段 9。一次确认送达的投递一行，
  # 记「递给哪个 JD、用的是哪一版快照」，与号段 1 的 `usage_ledger` 以 `ledger_id` 一对一相连——
  # 额度与经过分列两表：账本永远只回答「今天用掉几个」，投递域不必把计数背成第二套状态（AGENTS.md §2.7）。
  # 摘掉这一行，下面的 `outbound-deliver` 连同进 PENDING（它的 `inject` 里有它）：
  # 宁可递不出去，也不要「递出去了但事后说不清递的是哪一版」。
  - id: outbound-delivery-records
    dependsOn: [store]

  # 简历投递编排（spec 2.6-01…07）：打招呼的下游，复用同一条闸门/账本/频控，只多「等人确认」这一段。
  # 档位显式写在这里而不是藏在代码默认值里：2.6-01 的验收要在装配面板现场改 `suggest / semi / auto`
  # 并看着行为变，而默认值必须是 `semi`——默认 `auto` 等于装好 app 就往真实站点上自动递简历。
  # 摘掉这一行：`resume.deliver` 节点得到「执行器未登记」的结构化失败；上一行摘掉则投递照旧、打招呼没了。
  # `resumeFile` 是 P3（简历 PDF 生成）之前的临时默认路径，请求里带 `filePath` 时以请求为准（plan §13.5）。
  - id: outbound-deliver
    dependsOn: [entitlement, outbound-throttle, outbound-delivery-records, platform-registry]
    config:
      autonomy: semi
      approveTimeoutMs: 120000
      maxResumeBytes: 5242880

  # BOSS 适配器（spec 2.2-06 / 2.2-08）：站点知识全在 `packages/platform-boss/src/knowledge/boss.json`，
  # 本包挂起来时把自己 `register` 进上一行——`browser` 与 `workflow` 因此一行代码都不改。
  # 注掉这一行，界面上的平台清单立刻少一项，`platform.registry.get('boss')` 得到 `PLATFORM_NOT_REGISTERED`，
  # 打招呼那一路也同时失去渠道（`outbound.greet` 现问现取，返回 `OUTBOUND_CHANNEL_MISSING`）。
  # 想用外部知识文件验证「改数据不改代码」：给 `packFile` 填一个绝对路径（2.6 走这条口）。
  # 2.5-d 起它还要 `browser.act` 那三只手（敲字 / 点击 / 等文本变化）才打得招呼，只读定位不再够用。
  - id: platform-boss
    dependsOn: [platform-registry, browser, browser-act]

  # 会话消息库（spec 2.5-07）：`conversation_messages` 表由本服务自己把迁移 push 进 `store.migrations`，
  # 号段取 5（账本 1、agent 会话 2、jobs 3、workflow run 4）。表形状是通用的，读它的那只手是平台的，
  # 所以它和 `jd-store` 一样待在平台包里（plan §12.10 第 1 条）。
  # **不**依赖 `platform-boss`：摘掉适配器时本服务照样挂载（`list` / `status` 读的是已落库的真相），
  # 只有 `syncFrom` 会得到 `PLATFORM_NOT_REGISTERED` 的结构化失败——「读不到页面」与「库里没有会话」是两件事。
  - id: conversation-store
    dependsOn: [store, platform-registry]
    config:
      platform: boss

  # 工作流落库（spec 2.4-05 / 2.4-10）：`workflow_runs` / `workflow_nodes` 两张表由本服务自己把迁移
  # push 进 `store.migrations`，号段取 4（`usage_ledger` 1、`chat` 2、`jobs` 3 —— 号段全局，撞号在运行期才炸）。
  # 摘掉这一行，`workflow` 连同进 PENDING：界面上读不到任何 run 状态，而不是「跑完了但没记录」。
  - id: workflow-store
    dependsOn: [store]

  # JD 库（spec 2.3-02 / 2.3-04 / 2.3-05）：`jobs` 表由本服务自己把迁移 push 进 `store.migrations`，
  # 号段取 3（`usage_ledger` 1、`chat` 2 —— 号段是全局的，撞号在运行期才炸）。
  # 摘掉这一行，`jd-capture` 连同进 PENDING：界面点「搜索并入库」得到结构化错误而不是静默不入库。
  - id: jd-store
    dependsOn: [store]

  # 抓取编排（spec 2.3-01 / 2.3-06…2.3-11）：滚动收集 → 逐条读详情 → 落库。
  # `targetCount` 是「抓够就停」的判据、`maxRounds` 是不死循环的硬上限，两者都写进清单而不是代码里（§2.7）。
  # 轮间停顿**不在这里**：节奏唯一出口是 `outbound.throttle`（spec 2.7-04），所以依赖里带上它。
  # 依赖里还带 `entitlement`（spec 2.7-03）：一次抓取 run 现在过闸门并占一条 `search` 额度。
  # 注掉 `entitlement` 这一行：本服务连同进 PENDING，界面点「搜索并入库」得到结构化错误，
  # 而不是「额度体系塌了但抓取照跑」——那正是 §7.3 要防的绕过。
  - id: jd-capture
    dependsOn: [platform-boss, browser, jd-store, usage, outbound-throttle, entitlement]
    config:
      platform: boss
      targetCount: 20
      maxRounds: 8

  # 工作流执行器（spec 1.10 → 2.4-01/02/05/06/10）：槽位来自**计划**（`planId` 选 `WORKFLOW_PLANS` 里的一条），
  # 执行函数来自 `workflow-executors` 登记处，每一步的开始/结束/失败同时写进 `workflow-store` 的两张表。
  # 依赖里带 store：run 状态必须是重启后还在的真相，而不是一次性的内存镜像。
  # **不**依赖 entitlement：`boss-basic` 的三个节点是 read / read / local-write，没有真实外发（§7.3 的约束
  # 在 2.5 打招呼、2.6 投递接进来时生效，届时那两类的 `effect: outbound` 节点会走闸门）。
  # 演示退避与续跑：在装配面板改 `retryTimes` / `retryBackoffMs`（不重启 app），或注掉 `workflow-executors`
  # 让 `jd.capture` 无人登记——界面得到的是「执行器未登记」的结构化失败，而不是静默空转。
  - id: workflow
    dependsOn: [ipc, workflow-store, workflow-executors]
    config:
      planId: boss-basic
      retryTimes: 2
      retryBackoffMs: 500
      retryBackoffCapMs: 5000
      maxNodesPerRun: 20
      evidenceDomChars: 800
      evidenceTextChars: 300
      evidenceDir: evidence
      retentionRuns: 20

  # 简历文档存储（spec 3.1-08 / P3 生成轨地基）：`resume_docs` 表由本服务自己把迁移推进（号段 6）。
  # 只落库、不渲染：3.2 模板与 3.3 打印轨都从这张表读同一份合法文档。依赖里带 store 即可，
  # 无运行期配置（Schema 是空 strictObject）。摘掉它，后续任何按 id 读简历文档的入口得到结构化失败。
  - id: resume-doc
    dependsOn: [store]

  # 导出快照（spec 3.7-01）：`resume_snapshots` 表由本服务自己把迁移推进（号段 8，账本 1…consent 6、resume_docs 7）。
  # 每次 `resume.export` 成功后记一行不可变快照，供 3.7-04 按 id 还原、3.7-02 投递追溯读取。
  # `maxSnapshots` 是每份文档的保留上限（3.7-05）：显式写在这里而不是藏在代码默认值里，演示「写了 N+1 份只留最新 N 份」
  # 能在装配面板现场改小、不重启 app。摘掉这一行，下面的 `resume-export` 连同进 PENDING（它的 `inject` 里有它）。
  - id: resume-snapshot
    dependsOn: [store]
    config:
      maxSnapshots: 20

  # 导出编排（spec 3.3-11）：读合法文档 → 装配打印请求 → 交给 `resume.print` 端口渲染 → 落盘 + 回写页数 → 记快照，
  # 收敛成 `resume.export` 服务。它自己**不认识 Electron**（L2 领域包），只经端口消费打印能力（ports-and-adapters，plan §3.3）。
  # 四条 `dependsOn` 各对应一种「装不上就报结构化错误」的演示：摘 `resume-doc` 读不到文档、摘 `resume-print` 无人渲染、
  # 摘 `resume-snapshot` 导不成（导出即留档被拆成可单独摘的一环）、摘 `config` 拿不到 userData 落盘目录——四者都让本服务连同 PENDING，而不是崩在运行期。
  - id: resume-export
    dependsOn: [resume-doc, resume-print, resume-snapshot, config]

  # 简历导入（spec 4.1-06 / 07 / 09 / 10）：`resume_imports` 表由本服务自己把迁移推进（号段 10，
  # delivery_records 是 9），也是 PDF / DOCX / Markdown 三条输入腿在桌面端的唯一入口。
  # `maxBytes` 是单次导入的字节上限（防误选大文件把主进程吃掉），显式写在这里而不是藏在代码默认值里，
  # 演示「选了一份 20 MB 的文件」能在装配面板现场改小、不重启 app。
  # 依赖只有 store：抽取与判定全在 `@auto-cc/plugin-resume-kb` 内部（pdf.js / mammoth 是外置依赖，见 1.7-15），
  # 不认识导出轨——摘掉这一行，界面「导入简历」得到「服务未挂载」的结构化失败，导出照旧。
  - id: resume-parse
    dependsOn: [store]
    config:
      maxBytes: 5242880

  # 对话式主界面的另一半（spec 1.11）：会话 / 消息 / 档位。`agent`（工具注册表）排在更上面，
  # 因为 2.8-08 之后登记工具的是 L2 的能力包，注册表必须比它们先挂载——理由写在那一行的注释里。
  # 演示流式速度：在装配面板改 chunkChars / chunkIntervalMs（不重启 app）。
  - id: chat
    dependsOn: [agent, store]
    config:
      chunkChars: 6
      chunkIntervalMs: 120

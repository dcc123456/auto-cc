# electron-builder 配置：一份声明出 win / mac / linux 三端（spec 1.7-01）。
# 输入是 scripts/build.ts 组装的 staging 目录，里面没有 node_modules，所以产物零依赖（spec §8.2 决策 1）。
appId: com.autocc.desktop
productName: auto-cc
copyright: Copyright © 2026 auto-cc

directories:
  app: build/app
  output: dist
  buildResources: build/assets

# staging 目录里没有 electron，electron-builder 的自动发现（从 app 目录往上找 node_modules）会失败，
# 所以版本号必须显式声明。值由 scripts/build.ts 与 packages/main 实际安装的 electron 版本对比校验，
# 防止升级依赖后静默打出另一个内核（spec §8.2 决策 8）。
electronVersion: 44.4.5

# 跨平台构建时 electron 发行包必须下载（同平台的 win 构建会直接复用 node_modules 里已装好的 dist）。
# 默认源是 GitHub release，本网络环境不可达（实测 ETIMEDOUT 20.205.243.166:443），
# 所以与 `.npmrc` 的 `electron_mirror` 保持同一个镜像；校验和从同目录的 SHASUMS256.txt 取。
electronDownload:
  mirror: https://registry.npmmirror.com/-/binary/electron/

# staging 已是最终形态，不需要再解析依赖或跑 native rebuild。
npmRebuild: false
asar: true
# 外置依赖（spec 4.1-c 决策：依赖外置 + `asarUnpack`）。pdf.js 的 worker 由 `pdf.mjs` 用 ESM `import()`
# 按自身文件位置解析，留在 asar 内的读取路径本仓库未实测，所以解包到 `app.asar.unpacked`；
# mammoth 是纯 CJS、按 require 解析，留在 asar 内即可，不解包（多解一份就多一份安装体积）。
asarUnpack:
  - node_modules/pdfjs-dist/**

files:
  - '**/*'

# 主进程清单与托盘图标按 `process.resourcesPath` 下的文件名读取（spec §8.2 决策 2）。
extraResources:
  - from: cordis.yml
    to: cordis.yml
  - from: resources/icon.png
    to: icon.png
  # 许可记账随包分发（spec 5.9-04）：THIRD-PARTY-NOTICES.txt 由 vendor-runtime-deps.ts 在
  # app:build 阶段生成到 build/app 旁边；LICENSES.md 是仓库里的记账文档本体。
  # 放在 Resources/ 而不是 asar 里，用户在安装目录里能直接看到，不必解包。
  - from: build/app/THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
  - from: LICENSES.md
    to: LICENSES.md
  # 随包字体（spec 3.3-05 / 3.5-06）：`resume.print` 的 `fontBaseUrl()` 打包态读
  # `process.resourcesPath/fonts`，而 `directories.app` 是 `build/app`（`files: '**/*'` 只覆盖那份 staging），
  # 所以仓库里的 `resources/fonts` 不会自己进包——不补这一条，装机版打印会退回系统字体、
  # 编辑轨的中文叠加则以 `font-unavailable` 失败。整目录带上，连同 OFL 许可全文（§8.7）。
  - from: resources/fonts
    to: fonts

win:
  icon: resources/icon.png
  target:
    - nsis
  # 骨架阶段不接签名链：本机无证书，签名与公证归 P5 发布计划（spec §8.2 决策 4）。
  artifactName: auto-cc-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  # 卸载不清 userData：登录态与知识库从 P2 起是用户资产，删掉不可恢复。
  deleteAppDataOnUninstall: false

mac:
  icon: resources/icon.png
  category: public.app-category.productivity
  # electron 自己的许可全文：win/linux 的 unpacked 目录里 electron-builder 会自动放
  # `LICENSE.electron.txt` / `LICENSES.chromium.html`，**mac 的 .app 布局它不放**（44.4.5 实测：
  # `Contents/Resources/` 里只有本仓库 extraResources 那几条）。MIT/BSD 的义务是「随副本分发许可全文」，
  # 装到用户机器上的那份副本里不能没有它，所以显式补进 Resources，`scripts/check-licenses.ts` 的产物侧核对钉住这条。
  extraResources:
    - from: packages/main/node_modules/electron/dist/LICENSE
      to: LICENSE.electron.txt
    - from: packages/main/node_modules/electron/dist/LICENSES.chromium.html
      to: LICENSES.chromium.html
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: auto-cc-${version}-mac-${arch}.${ext}

dmg:
  artifactName: auto-cc-${version}-mac-${arch}.${ext}

linux:
  icon: resources/icon.png
  maintainer: auto-cc <auto-cc@example.com>
  synopsis: Desktop job-hunting copilot
  category: Utility
  target:
    - AppImage
    - deb

appImage:
  artifactName: auto-cc-${version}-linux-${arch}.${ext}

deb:
  artifactName: auto-cc-${version}-linux-${arch}.${ext}

# 更新通道的产物侧前置（spec 5.9-03）。实测：electron-updater 的下载半边会读
# `resources/app-update.yml` 取 `updaterCacheDirName`（AppUpdater.getOrCreateDownloadHelper →
# loadUpdateConfig 直接 readFile），而这个文件只有在配置了 publish 时才会生成——没有它，检查能过、
# 下载必然 ENOENT。所以这里必须声明 publish，哪怕只是占位源。
# 占位 URL 用保留的 .invalid 顶级域（RFC 2606：永不解析），且运行期从不使用它：
# 真正抓哪份 latest.yml 由 cordis.yml 的 `update.feedUrl` 经 `setFeedURL` 决定；
# 而 feedUrl 缺席时更新通道连 updater 单例都不解析，一次网络请求都不会发（5.9-b 的判据）。
publish:
  provider: generic
  url: https://update.auto-cc.invalid/

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>求职仿站 · 职位搜索（本地 fixture）</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font:
          13px/1.7 system-ui,
          sans-serif;
        color: #e2e8f0;
        background: #0f172a;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 16px;
      }
      .notice {
        margin: 10px 0;
        padding: 8px 10px;
        border: 1px solid #334155;
        border-radius: 6px;
        background: #1e293b;
        color: #cbd5e1;
      }
      .auth {
        font-weight: 600;
        color: #7dd3fc;
      }
      .card {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        align-items: baseline;
        margin: 0 0 10px;
        padding: 14px 16px;
        min-height: 96px;
        align-content: flex-start;
        border: 1px solid #1e293b;
        border-radius: 8px;
        background: #111c31;
      }
      .card .title {
        font-size: 14px;
        font-weight: 600;
        color: #f1f5f9;
      }
      .card .salary {
        color: #f59e0b;
      }
      .card .muted {
        color: #94a3b8;
      }
      a {
        color: #7dd3fc;
      }
      .footer-space {
        min-height: 45vh;
        margin-top: 16px;
        padding-top: 8px;
        border-top: 1px dashed #1e293b;
        color: #475569;
      }
      /* 哨兵要有可见高度才谈得上「进入视口」，见下方 HTML 注释里的实测结论。 */
      .sentinel {
        min-height: 28px;
        padding-top: 8px;
        color: #475569;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>职位搜索</h1>
    <p class="notice">
      本地仿站（fixture）：DOM 结构刻意模仿招聘列表页，<strong>数据全为虚构</strong>，与任何真实公司、真实职位无关。
      自动化验收一律打这一页，不碰真实平台（AGENTS.md §7.2）。
    </p>
    <p class="notice" id="auth-banner" data-logged-in="{{loggedIn}}">
      当前登录状态：<span class="auth">{{authLabel}}</span> · 会话 cookie：<code>autocc_session</code>
    </p>
    <p>
      <a id="login-link" href="/login?next=%2Fboss">在仿站登录</a>
      ·
      <a id="logout-link" href="/logout?next=%2Fboss">在仿站退出</a>
    </p>

    <p data-testid="list-filter">当前筛选：（读取中）</p>
    <p data-testid="list-status">状态：（加载中）</p>

    <ul style="list-style: none; margin: 0; padding: 0" data-testid="jd-list"></ul>
    <div class="sentinel" data-testid="list-sentinel" aria-hidden="true">滚动加载更多岗位…</div>
    <!-- 页脚留白是刻意加的：无限滚动的靶页必须「不滚动就看不到哨兵」，否则首屏就把全部岗位长出来，
         spec 2.3-06 要的「靠滚动加载、抓够就停」会在截图里退化成一屏读满。
         哨兵自己必须**有面积**：实测零高度的空 div 滚到视口里也不会被判为 intersecting，
         于是第二屏永远长不出来（抓取会在第一轮就以「页面无新增」停下）。 -->
    <div class="footer-space">页脚广告位（本地仿站留白）</div>

    <script>
      const list = document.querySelector('[data-testid="jd-list"]');
      const statusLine = document.querySelector('[data-testid="list-status"]');
      const filterLine = document.querySelector('[data-testid="list-filter"]');
      const sentinel = document.querySelector('[data-testid="list-sentinel"]');
      /** 条件名与站点知识包 `search.params` 一致：抓取端拼出来的地址，由这里原样读回并生效。 */
      const conditions = new URLSearchParams(window.location.search);
      let page = 0;
      let total = 0;
      let hasMore = true;
      let loading = false;

      filterLine.textContent =
        '当前筛选：' +
        ['query', 'city', 'experience'].map((name) => name + '=' + (conditions.get(name) || '（不限）')).join(' · ');

      /**
       * 追加一张职位卡片。
       * @param job `/api/jobs` 回的一条岗位
       */
      function appendCard(job) {
        const card = document.createElement('li');
        card.className = 'card';
        card.dataset.testid = 'jd-card';
        card.dataset.jobId = job.id;
        // 结构必须与知识包的候选声明对齐：容器 `li.card[data-testid=jd-card]`，
        // 卡片内 `a[data-field=title]` 的 href 就是详情页地址，其后五个 span 依次是公司/薪资/城市/经验/学历。
        const title = document.createElement('a');
        title.className = 'title';
        title.dataset.field = 'title';
        title.href = job.detailUrl;
        title.textContent = job.title;
        card.append(title);
        for (const [field, value, extraClass] of [
          ['company', job.company, 'muted'],
          ['salary', job.salary, 'salary'],
          ['city', job.city, 'muted'],
          ['experience', job.experience, 'muted'],
          ['education', job.education, 'muted'],
        ]) {
          const span = document.createElement('span');
          span.className = extraClass;
          span.dataset.field = field;
          span.textContent = value;
          card.append(span);
        }
        list.append(card);
      }

      /** 将当前卡片数与服务端读数写进状态行：截图里要能同时看到「页面长了几张卡」和「还有没有更多」。 */
      function reportState() {
        statusLine.textContent =
          '状态：已渲染 ' +
          String(list.children.length) +
          ' 张卡 · 命中 ' +
          String(total) +
          ' 条 · ' +
          (hasMore ? '继续滚动可加载更多' : '没有更多了');
      }

      /**
       * 拉取下一页并追加卡片（真实无限滚动的形态：地址不变，内容靠滚动长出来）。
       * @returns 本次拉取完成信号；失败时只把原因写进状态行，不抛给页面
       */
      async function loadNextPage() {
        if (loading || !hasMore) return;
        loading = true;
        page += 1;
        const query = new URLSearchParams({
          query: conditions.get('query') || '',
          city: conditions.get('city') || '',
          experience: conditions.get('experience') || '',
          page: String(page),
        });
        try {
          const response = await fetch('/api/jobs?' + query.toString());
          const payload = await response.json();
          for (const job of payload.items) appendCard(job);
          total = payload.total;
          hasMore = payload.hasMore;
          reportState();
        } catch (error) {
          page -= 1;
          statusLine.textContent = '状态：加载失败 · ' + String(error);
        } finally {
          loading = false;
        }
      }

      // 首屏自己加载一次；之后的每一屏都要求「滚动过且哨兵进入视口」，
      // 否则视口够高的时候观察器会在首屏就把全部岗位一口气长出来，滚动加载这条路径就演示不到了。
      void loadNextPage();
      const observer = new IntersectionObserver(
        (entries) => {
          if (entries.some((entry) => entry.isIntersecting) && window.scrollY > 0) void loadNextPage();
        },
        { root: null, rootMargin: '0px', threshold: 0 },
      );
      observer.observe(sentinel);
    </script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>求职仿站 · 职位详情（本地 fixture）</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font:
          13px/1.7 system-ui,
          sans-serif;
        color: #e2e8f0;
        background: #0f172a;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 16px;
      }
      h2 {
        margin: 18px 0 8px;
        font-size: 14px;
        color: #94a3b8;
      }
      .notice {
        margin: 10px 0;
        padding: 8px 10px;
        border: 1px solid #334155;
        border-radius: 6px;
        background: #1e293b;
        color: #cbd5e1;
      }
      .auth {
        font-weight: 600;
        color: #7dd3fc;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        color: #94a3b8;
      }
      .salary {
        color: #f59e0b;
      }
      a {
        color: #7dd3fc;
      }
      article.detail {
        margin-top: 14px;
        padding: 14px 16px;
        border: 1px solid #1e293b;
        border-radius: 8px;
        background: #111c31;
      }
      .posted {
        color: #7dd3fc;
      }
    </style>
  </head>
  <body>
    <h1 data-field="title">{{title}}</h1>
    <p class="meta">
      <span data-field="company">{{company}}</span>
      <span class="salary" data-field="salary">{{salary}}</span>
      <span data-field="city">{{city}}</span>
      <span data-field="experience">{{experience}}</span>
      <span data-field="education">{{education}}</span>
    </p>
    <p class="notice" id="auth-banner" data-logged-in="{{loggedIn}}">
      当前登录状态：<span class="auth">{{authLabel}}</span>
    </p>
    <p>
      <a id="back-link" href="/boss">返回搜索结果</a>
      · 岗位编号 <code data-testid="job-id">{{jobId}}</code>
    </p>

    <!-- 详情正文根节点：知识包的 `detailRoot` 认的就是它（`article.detail` / data-testid=jd-detail），
         页头那几行标题与公司刻意留在根外——把页头读成岗位描述是详情页抓取最典型的错法。 -->
    <article class="detail" data-testid="jd-detail">
      <p>发布时间：<span class="posted" data-field="posted">{{posted}}</span></p>
      <section>{{descriptionSection}} {{requirementSection}}</section>
    </article>
  </body>
</html>
